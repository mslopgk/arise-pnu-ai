# arise-ai.pusan.ac.kr — TLS 종단 + WAS(Express) 리버스 프록시
# 인증서: 부산대 와일드카드 *.pusan.ac.kr (GlobalSign OV, 만료 2027-01-02)
#   서버: ~/arise-stack/certs/{fullchain.pem,privkey.pem} — 전산팀 발급본으로 교체 후 nginx reload
#   로컬 검증(validate-stack.sh): deploy/certs 의 self-signed placeholder 사용
# 80 포트는 무조건 301 → HTTPS.
#   prod에서 admin/OAuth 쿠키가 Secure 플래그라 평문 HTTP로 서빙하면 브라우저가 쿠키를
#   버려 로그인 무한 루프가 됨(내부망 IP 접속에서 실제 발생 — 2026-06-12 분석).

# HTTP → HTTPS 강제 (도메인 접속 시에만)
server {
    listen 80;
    listen [::]:80;
    server_name arise-ai.pusan.ac.kr;

    location / {
        return 301 https://$host$request_uri;
    }
}

# IP 주소나 기타 호스트로 접속 시 HTTP로 그대로 서빙 (내부망 접속/테스트 지원)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://was:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS 본 트래픽
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arise-ai.pusan.ac.kr _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 관리자 이미지 업로드는 base64 JSON(backend express.json limit 8mb).
    # nginx 기본 1m이면 큰 이미지가 413으로 막히므로 여유 있게 잡는다.
    client_max_body_size 10m;

    # 레거시 정적 게이트웨이 arise.html → 라이브 React 게이트웨이(/)로 영구 이동.
    # (arise.html의 /s30/* 링크는 s30 미배포라 404 — 죽은 링크 노출 방지)
    location = /arise.html {
        return 301 https://$host/;
    }

    location / {
        proxy_pass http://was:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
