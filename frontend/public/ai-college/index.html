<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176bcc" />
    <title>부산대학교 AI대학</title>
    <!-- Noto Sans KR 가변 폰트 로컬 번들 — Google Fonts CDN 대신(폐쇄망 대응) -->
    <link rel="stylesheet" href="./fonts/noto-sans-kr.css" />
    <link rel="stylesheet" href="./styles.css?v=20260823-86" />
  </head>
  <body>
    <header class="site-header" aria-label="사이트 헤더">
      <a class="brand" href="#intro" data-home>
        <img class="pnu-signature" src="./assets/pnu-signature.png" alt="부산대학교" />
        <span class="ai-hub-name">AI거점대학교</span>
      </a>
      <div class="header-actions">
        <form id="site-search" class="site-search" role="search">
          <input id="site-search-input" type="search" placeholder="검색" aria-label="사이트 콘텐츠 검색" autocomplete="off" />
          <button class="search-button" type="submit" aria-label="검색"><span class="search-icon" aria-hidden="true"></span></button>
          <span id="search-status" class="search-status" aria-live="polite"></span>
        </form>
      </div>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="global-menu" hidden>메뉴</button>
      <nav id="global-menu" class="global-menu" aria-label="주요 메뉴" hidden></nav>
    </header>

    <main id="app">
      <section id="intro" class="scrub-zone" aria-label="AI대학 소개 영상">
        <div class="scrub-stage">
          <picture id="scrub-poster" class="scrub-poster" aria-hidden="true">
            <source media="(max-width: 720px), (pointer: coarse)" srcset="./assets/higgsfield-pnu-poster.webp" />
            <img src="./assets/higgsfield-pnu-poster.webp" alt="" />
          </picture>
          <video id="scrub-video" class="scrub-video" muted playsinline preload="auto" aria-label="AI대학 소개 영상"></video>
          <div class="video-fallback" aria-hidden="true"></div>
          <div class="video-dim" aria-hidden="true"></div>
          <section id="index" class="index-overlay" aria-labelledby="index-title">
            <div class="index-inner">
              <div class="index-heading">
                <h1 id="index-title"><span class="muted-title">AI의 미래,</span><br />여기서 시작됩니다.</h1>
                <div class="hero-intro-copy">
                  <strong>2027년 3월, AI 대학 출범</strong>
                  <p>인공지능으로 배우고, 연결하고, 미래를 창조합니다.</p>
                </div>
              </div>
              <div id="index-list" class="index-list"></div>
            </div>
            <footer class="footer">
              <span>051-510-1234 · ai@pusan.ac.kr</span>
              <span>© 2026 College of AI, Pusan National University. All rights reserved.</span>
            </footer>
          </section>
        </div>
      </section>

      <section id="detail" class="detail-view" aria-live="polite" hidden>
        <nav class="detail-nav" aria-label="현재 위치">
          <button id="category-button" class="category-button" type="button"></button>
          <img src="./assets/chevron-right.svg" width="24" height="24" alt="" />
          <div class="subnav-wrap">
            <button id="subnav-button" class="subnav-button" type="button" aria-expanded="false"></button>
            <div id="subnav-menu" class="subnav-menu" hidden></div>
          </div>
        </nav>
        <div id="detail-content"></div>
      </section>
    </main>

    <script src="./faculty-data.js?v=20260823-1"></script>
    <script src="./app.js?v=20260823-86"></script>
  </body>
</html>
